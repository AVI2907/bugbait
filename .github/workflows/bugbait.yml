# BugBait testing itself: scores the calculator demo with built-in bugs (no API key).
name: BugBait
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bugbait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python3 main.py calculator --offline --no-fix --fail-under 30
