<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' {{csp}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugBait</title>
<style>
  :root {
    --caught: #2EC4B6; --survived: #E9A13B; --closed: #5FBF6A; --failed: #E5534B;
    --bg: var(--vscode-editor-background); --fg: var(--vscode-foreground);
    --muted: var(--vscode-descriptionForeground); --line: var(--vscode-panel-border, rgba(128,128,128,.35));
    --raise: var(--vscode-list-hoverBackground); --mono: var(--vscode-editor-font-family, monospace);
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--vscode-font-family); font-size: 13px; margin: 0; padding: 20px 22px 40px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  .status { color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; margin: 8px 0 6px; font-weight: 700; }
  .lede { color: var(--muted); line-height: 1.5; margin: 0; max-width: 60ch; overflow-wrap: anywhere; }
  .score { display: flex; align-items: baseline; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .score b { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .score .before { color: var(--survived); } .score .after { color: var(--closed); }
  .score span { color: var(--muted); }
  .net { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .cell { width: 38px; height: 38px; border-radius: 8px; border: 2px dashed var(--line); background: none; display: grid; place-items: center;
          font-family: var(--mono); font-weight: 600; color: var(--muted); cursor: pointer; transition: background .3s, border-color .3s; }
  .cell.caught { background: var(--caught); border: 2px solid var(--caught); color: #08201d; }
  .cell.survived, .cell.fixing { border: 2px solid var(--survived); color: var(--survived); }
  .cell.fixing { animation: pulse 1.1s infinite; }
  .cell.closed { background: var(--closed); border: 2px solid var(--closed); color: #0b2410; }
  .cell.skipped { border: 2px solid var(--muted); }
  .cell.failed { border: 2px solid var(--failed); color: var(--failed); }
  .cell.selected { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
  @keyframes pulse { 50% { background: rgba(233,161,59,.22); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); margin-top: 10px; font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .btn.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .detail { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
  .detail h2 { font-size: 17px; margin: 0; }
  .detail h3 { font-size: 12px; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  .detail p { line-height: 1.5; margin: 6px 0 0; }
  .where { font-family: var(--mono); color: var(--vscode-textLink-foreground); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .tag { font-weight: 600; margin-left: 6px; font-size: 13px; }
  .tag.caught { color: var(--caught); } .tag.survived, .tag.fixing { color: var(--survived); }
  .tag.closed { color: var(--closed); } .tag.failed { color: var(--failed); } .tag.skipped, .tag.pending { color: var(--muted); }
  pre { margin: 0; background: var(--vscode-textCodeBlock-background, rgba(128,128,128,.1)); border-radius: 6px; padding: 10px 0; overflow-x: auto;
        font-family: var(--mono); font-size: var(--vscode-editor-font-size, 12px); line-height: 1.55; }
  pre .ln { display: block; padding: 0 12px; white-space: pre; min-height: 1.55em; }
  pre .ln b { display: inline-block; width: 3em; color: var(--muted); font-weight: 400; }
  pre .del { background: rgba(229,83,75,.16); } pre .add { background: rgba(233,161,59,.18); }
  .empty { color: var(--muted); }
  .spot { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; cursor: pointer; }
  .spot b { color: var(--survived); font-variant-numeric: tabular-nums; min-width: 3.2em; }
  .spot span { color: var(--muted); }
  .kind { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
  .error { margin-top: 14px; border: 1px solid var(--failed); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="status" id="status">Ready</div>
  <h1 id="headline">Find out what your tests would miss.</h1>
  <p class="lede" id="lede">Run BugBait on this project. AI agents plant realistic bugs in your code, check which ones your tests catch, and write verified tests for the ones that get through.</p>
  <div class="actions" id="startActions"><button class="btn primary" id="runBtn">Test this project</button></div>
  <div class="score" id="score" hidden><b class="before" id="before"></b><b id="arrow" hidden>→</b><b class="after" id="after" hidden></b><span id="scoreCap"></span></div>
  <div class="net" id="net"></div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:var(--caught)"></i>Caught by your tests</span>
    <span><i style="border:2px solid var(--survived)"></i>Got through</span>
    <span><i style="background:var(--closed)"></i>Caught by BugBait's test</span>
  </div>
  <div class="actions" id="doneActions" hidden><button class="btn primary" id="addBtn">Add tests to project</button><button class="btn" id="prBtn" hidden>Open pull request</button><button class="btn" id="againBtn">Run again</button></div>
  <p class="lede" id="prLine" hidden></p>
  <div id="risk" hidden><h3 style="font-size:13px;margin:22px 0 6px">Weakest spots</h3><div id="riskList"></div></div>
  <div class="error" id="error" hidden></div>
  <div class="detail" id="detail" hidden></div>

<script nonce="{{nonce}}">
const vscode = acquireVsCodeApi();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (n, t) => t ? Math.floor(n * 100 / t) : 0;
let S;

function reset() {
  S = { bugs: new Map(), sel: null, tests: 0, total: 0 };
  $("net").innerHTML = ""; $("detail").innerHTML = "";
  for (const id of ["score", "arrow", "after", "legend", "doneActions", "error", "detail", "prBtn", "prLine", "risk"]) $(id).hidden = true;
  $("startActions").hidden = true;
  $("headline").textContent = "Starting BugBait…"; $("lede").textContent = ""; $("status").textContent = "";
}
function head(h, l) { $("headline").textContent = h; if (l !== undefined) $("lede").textContent = l; }

function view(b) {
  if (b.after === false && b.before === true) return ["closed", "Caught by BugBait's test"];
  if (b.fix?.status === "skipped") return ["skipped", "Harmless"];
  if (b.fix?.status === "failed") return ["failed", "No test found"];
  if (b.fixing) return ["fixing", "Fixer at work"];
  if (b.before === true) return ["survived", "Got through"];
  if (b.before === false) return ["caught", "Caught"];
  return ["pending", "Testing…"];
}
function render(id) {
  const b = S.bugs.get(id), [cls, label] = view(b), c = $("c" + id);
  c.className = "cell " + cls + (S.sel === id ? " selected" : ""); c.title = `Bug ${id}: ${label}`;
  if (S.sel === id) detail();
}
function select(id) { const p = S.sel; S.sel = id; if (p) render(p); render(id); }

function code(b) {
  const c = b.context; if (!c) return "";
  const n = b.old.split("\n").length, out = [];
  c.lines.forEach((t, i) => {
    const ln = c.start + i;
    if (ln === c.line) {
      const orig = c.lines.slice(i, i + n).join("\n");
      orig.split("\n").forEach((x, k) => out.push(`<span class="ln del"><b>${ln + k}</b>${esc(x)}</span>`));
      orig.replace(b.old, b.new).split("\n").forEach(x => out.push(`<span class="ln add"><b>+</b>${esc(x)}</span>`));
    } else if (!(ln > c.line && ln < c.line + n)) out.push(`<span class="ln"><b>${ln}</b>${esc(t)}</span>`);
  });
  return `<pre>${out.join("")}</pre>`;
}
function detail() {
  const b = S.bugs.get(S.sel); if (!b) return;
  const [cls, label] = view(b);
  let h = `<h2>Bug ${b.id}<span class="tag ${cls}">${label}</span></h2>
    <p><button class="where" data-file="${esc(b.file)}" data-line="${b.context?.line || 1}">${esc(b.file)}:${b.context?.line ?? ""}</button></p>
    ${b.kind ? `<p><span class="kind">${esc(b.kind)}</span><span class="kind">realism ${b.realism}/5</span>${b.function ? `<span class="kind">${esc(b.function)}</span>` : ""}</p>` : ""}
    <h3>What the Saboteur changed</h3>${code(b)}`;
  if (b.explanation) h += `<h3>${b.before === false ? "Saboteur's reasoning" : "Why your tests missed it"}</h3><p>${esc(b.explanation)}</p>`;
  if (b.fix?.status === "fixed") h += `<h3>Verified test from the Fixer</h3><pre>${esc(b.fix.test_code).split("\n").map(l => `<span class="ln">${l}</span>`).join("")}</pre>`;
  else if (b.fix?.status === "skipped") h += `<h3>Fixer's verdict</h3><p>${esc(b.fix.reason)}</p>`;
  else if (b.fix?.status === "failed") h += `<h3>Fixer couldn't write a working test</h3><p>${esc(b.fix.reason)}</p>`;
  $("detail").innerHTML = h; $("detail").hidden = false;
  $("detail").querySelector(".where").onclick = e => vscode.postMessage({ type: "open", file: e.target.dataset.file, line: +e.target.dataset.line });
}

const on = {
  reset,
  setup: e => { $("status").textContent = e.message; },
  start: e => { S.github = e.project.github; $("startActions").hidden = true; head(`Checking ${e.project.name}'s tests.`, "First, BugBait makes sure the project's own tests pass."); },
  baseline: e => { S.tests = e.tests; $("status").textContent = e.passed ? `${e.tests} existing tests pass` : "The project's own tests fail";
                   if (!e.passed) fail("The project's own tests don't pass yet, so BugBait can't measure them.\n\n" + (e.output || "")); },
  saboteur: e => { head("Muse Spark is planting bugs.", "The Saboteur looks for small, realistic mistakes your tests are likely to miss."); $("status").textContent = `Reading ${e.file}`; },
  bugs: e => {
    S.total = e.bugs.length;
    for (const raw of e.bugs) {
      S.bugs.set(raw.id, { ...raw, before: null });
      const c = document.createElement("button"); c.id = "c" + raw.id; c.textContent = raw.id; c.onclick = () => select(raw.id);
      $("net").appendChild(c);
    }
    $("legend").hidden = false; S.sel = e.bugs[0]?.id;
    for (const id of S.bugs.keys()) render(id);
    head(`Testing ${S.total} planted bugs.`, `Each one runs in its own sandbox against ${S.tests ? "all " + S.tests : "your"} tests.`);
  },
  bug_result: e => { S.bugs.get(e.id).before = e.survived; render(e.id); },
  score_before: e => {
    const missed = e.total - e.caught;
    head(`Your tests caught ${e.caught} of ${e.total} planted bugs.`,
      missed ? `${missed} got through. They're marked in your code. Select a bug to see what changed.` : "Every planted bug was caught. Nice test suite.");
    $("score").hidden = false; $("before").textContent = pct(e.caught, e.total) + "%"; $("scoreCap").textContent = "caught by your tests";
    const first = [...S.bugs.values()].find(b => b.before); if (first) select(first.id);
  },
  risk: e => {
    const weak = e.functions.filter(f => f.survived).slice(0, 5); if (!weak.length) return;
    $("riskList").innerHTML = weak.map(f => `<div class="spot" data-file="${esc(f.file)}" data-line="${f.line || 1}"><b>${f.survived}/${f.planted}</b>${esc(f.function)} <span>${esc(f.file)}</span></div>`).join("");
    $("riskList").querySelectorAll(".spot").forEach(el => el.onclick = () => vscode.postMessage({ type: "open", file: el.dataset.file, line: +el.dataset.line }));
    $("risk").hidden = false;
  },
  fixer_start: e => { for (const b of S.bugs.values()) if (b.before) { b.fixing = true; render(b.id); }
    head(`Writing tests for the ${e.count} that got through.`, "Each test must pass on your code and fail on the buggy version before it's accepted."); },
  fix_result: e => { const b = S.bugs.get(e.id); b.fixing = false; b.fix = e; render(e.id); },
  bug_after: e => { S.bugs.get(e.id).after = e.survived; render(e.id); },
  score_after: e => {
    head(`Now ${e.caught} of ${e.total} planted bugs are caught.`, `BugBait wrote ${e.tests_added} verified test${e.tests_added === 1 ? "" : "s"} for ${e.test_path}.`);
    $("arrow").hidden = $("after").hidden = false; $("after").textContent = pct(e.caught, e.total) + "%";
    $("scoreCap").textContent = "before and after BugBait's tests"; $("doneActions").hidden = false; $("addBtn").hidden = false;
    $("prBtn").hidden = !S.github;
  },
  done: e => { $("status").textContent = e.seconds ? `Finished in ${e.seconds}s` : "Finished"; if ($("doneActions").hidden) { $("doneActions").hidden = false; $("addBtn").hidden = true; } },
  error: e => fail(e.message),
  pr: e => { $("prLine").hidden = false; $("prLine").textContent = "Pull request opened: " + e.url; $("prBtn").hidden = true; },
};
function fail(msg) { $("error").textContent = msg; $("error").hidden = false; $("startActions").hidden = false; }

window.addEventListener("message", m => { const f = on[m.data.event]; if (f) f(m.data); });
$("runBtn").onclick = $("againBtn").onclick = () => vscode.postMessage({ type: "run" });
$("addBtn").onclick = () => vscode.postMessage({ type: "addTests" });
$("prBtn").onclick = () => vscode.postMessage({ type: "openPR" });
S = { bugs: new Map(), sel: null };
vscode.postMessage({ type: "ready" });
</script>
</body>
</html>
